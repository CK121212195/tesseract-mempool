<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether Tesseract // Bitcoin Network Meditations</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      font-family: 'Montserrat', sans-serif;
      color: #f3f4f6;
      user-select: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      box-sizing: border-box;
    }
    .glass-panel {
      background: rgba(3, 7, 18, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 12px;
      pointer-events: auto;
      max-width: 320px;
    }
    h1 {
      font-size: 1.0rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin: 0 0 12px 0;
      background: linear-gradient(45deg, #00d2ff, #00ffaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat {
      font-size: 0.75rem;
      font-weight: 200;
      letter-spacing: 0.1em;
      margin: 6px 0;
      color: rgba(255, 255, 255, 0.65);
    }
    .stat span {
      font-weight: 400;
      color: #00ffaa;
      font-family: 'Courier New', monospace;
    }
    #unmute-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      pointer-events: none;
      text-align: center;
      animation: pulse-text 2.5s infinite ease-in-out;
    }
    @keyframes pulse-text {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.75; }
    }
    #credit {
      font-size: 0.65rem;
      font-weight: 200;
      letter-spacing: 0.25em;
      color: rgba(255, 255, 255, 0.35);
    }
  </style>
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  
  <div id="unmute-overlay">
    [ Click anywhere to awaken cosmic harmony ]
  </div>

  <div id="ui-container">
    <div class="glass-panel">
      <h1>Aether Tesseract</h1>
      <div class="stat">Network: <span id="status">Connecting...</span></div>
      <div class="stat">Block Height: <span id="block-height">Loading...</span></div>
      <div class="stat">Tx Count: <span id="tx-count">0</span></div>
      <div class="stat">Processed BTC: <span id="total-btc">0.0000</span></div>
    </div>
    <div id="credit">
      REAL-TIME BITCOIN NETWORK VISUALIZATION // TESSERACT × MEMPOOL
    </div>
  </div>

  <script>
    // --- 1. WEB AUDIO API (ヒーリングアンビエント音の生成) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // 不協和音にならないAマイナーペンタトニックスケール
    const scale = [110.00, 146.83, 164.81, 220.00, 293.66, 329.63, 440.00, 587.33, 659.25, 880.00];
    let droneStarted = false;

    // ドローン低音の開始 (地球のうねり)
    function startDrone() {
      if (droneStarted) return;
      droneStarted = true;
      const now = audioCtx.currentTime;
      
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(55, now); // A1
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(110.3, now); // A2 + デチューンで揺らぎ

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(100, now);

      gain.gain.setValueAtTime(0.04, now);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start();
      osc2.start();
    }

    // トランザクション受信時のベル音 (金額に応じて高低が変化)
    function playTxSound(amount) {
      if (audioCtx.state === 'suspended') return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gainNode = audioCtx.createGain();

      // 金額が大きいほど低音で余韻を長く、小さいほど高音できらびやかに
      let noteIndex = Math.floor(Math.max(0, Math.min(scale.length - 1, scale.length - 1 - Math.log10(amount * 10 + 1) * 2)));
      if (isNaN(noteIndex)) noteIndex = Math.floor(Math.random() * scale.length);
      const freq = scale[noteIndex];

      osc.type = 'triangle'; 
      osc.frequency.setValueAtTime(freq, now);

      const duration = Math.min(6.0, 0.8 + amount * 2.5);
      gainNode.gain.setValueAtTime(0, now);
      gainNode.gain.linearRampToValueAtTime(0.08, now + 0.08); // 滑らかなアタック
      gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration); // 長いディケイ

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(freq * 1.5, now);

      osc.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + duration);
    }

    // 新規ブロック生成時の荘厳なゴング音
    function playBlockSound() {
      if (audioCtx.state === 'suspended') return;
      const now = audioCtx.currentTime;
      const chords = [110.00, 164.81, 220.00, 329.63]; // A2, E3, A3, E4

      chords.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gainNode = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.08, now + 0.5);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 8.0);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(freq * 2, now);

        osc.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 8.0);
      });
    }

    // 初回クリック時の音声アンミュート
    window.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(() => {
          startDrone();
          playTxSound(0.05); // フィードバック音
          document.getElementById('unmute-overlay').style.display = 'none';
        });
      }
    });

    // --- 2. THREE.JS VISUALS ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030712, 0.035);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(scene.fog.color);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 12;
    controls.minDistance = 2.5;

    // パーティクル用の輝く円テクスチャを動的に生成
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.2, 'rgba(0,180,255,0.7)');
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 16, 16);
      return new THREE.CanvasTexture(canvas);
    }
    const glowTexture = createGlowTexture();

    // -- A. 4次元テセラクト（超立方体）の数学的構築 --
    const vertices4D = [];
    for (let x of [-1, 1]) {
      for (let y of [-1, 1]) {
        for (let z of [-1, 1]) {
          for (let w of [-1, 1]) {
            vertices4D.push({ x, y, z, w });
          }
        }
      }
    }

    const edges = [];
    for (let i = 0; i < 16; i++) {
      for (let j = i + 1; j < 16; j++) {
        let diff = 0;
        if (vertices4D[i].x !== vertices4D[j].x) diff++;
        if (vertices4D[i].y !== vertices4D[j].y) diff++;
        if (vertices4D[i].z !== vertices4D[j].z) diff++;
        if (vertices4D[i].w !== vertices4D[j].w) diff++;
        if (diff === 1) edges.push([i, j]);
      }
    }

    // 4D回転関数
    function rotate4D(v, xw, yw, zw, xy) {
      let x = v.x, y = v.y, z = v.z, w = v.w;
      let cos, sin, tmp;

      // X-W
      cos = Math.cos(xw); sin = Math.sin(xw);
      tmp = x * cos - w * sin; w = x * sin + w * cos; x = tmp;
      // Y-W
      cos = Math.cos(yw); sin = Math.sin(yw);
      tmp = y * cos - w * sin; w = y * sin + w * cos; y = tmp;
      // Z-W
      cos = Math.cos(zw); sin = Math.sin(zw);
      tmp = z * cos - w * sin; w = z * sin + w * cos; z = tmp;
      // X-Y
      cos = Math.cos(xy); sin = Math.sin(xy);
      tmp = x * cos - y * sin; y = x * sin + y * cos; x = tmp;

      return { x, y, z, w };
    }

    // 4Dから3Dへの透視投影 (カメラのw位置dを設定)
    function project4D(v) {
      const d = 2.1;
      const factor = 1 / (d - v.w);
      return new THREE.Vector3(v.x * factor * 1.3, v.y * factor * 1.3, v.z * factor * 1.3);
    }

    // テセラクトのエッジ（ライン）
    const lineGeometry = new THREE.BufferGeometry();
    const linePositions = new Float32Array(edges.length * 2 * 3);
    lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
    const lineMaterial = new THREE.LineBasicMaterial({
      color: 0x00d2ff,
      transparent: true,
      opacity: 0.55,
      blending: THREE.AdditiveBlending
    });
    const tesseractLines = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(tesseractLines);

    // テセラクトの頂点（光る点）
    const pointGeometry = new THREE.BufferGeometry();
    const pointPositions = new Float32Array(16 * 3);
    pointGeometry.setAttribute('position', new THREE.BufferAttribute(pointPositions, 3));
    const pointMaterial = new THREE.PointsMaterial({
      size: 0.28,
      map: glowTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const tesseractPoints = new THREE.Points(pointGeometry, pointMaterial);
    scene.add(tesseractPoints);


    // -- B. 宇宙から見た「地球」を象徴する中心のワイヤー球体 --
    const earthGroup = new THREE.Group();
    scene.add(earthGroup);

    // 深海を思わせるブルーのワイヤーフレーム球
    const oceanGeo = new THREE.SphereGeometry(0.38, 18, 18);
    const oceanMat = new THREE.MeshBasicMaterial({
      color: 0x0055ff,
      wireframe: true,
      transparent: true,
      opacity: 0.22,
      blending: THREE.AdditiveBlending
    });
    const ocean = new THREE.Mesh(oceanGeo, oceanMat);
    earthGroup.add(ocean);

    // 雲や大気のゆらぎを思わせる、少し大きいシアンの球体
    const atmosphereGeo = new THREE.SphereGeometry(0.40, 16, 16);
    const atmosphereMat = new THREE.MeshBasicMaterial({
      color: 0x00ffcc,
      wireframe: true,
      transparent: true,
      opacity: 0.12,
      blending: THREE.AdditiveBlending
    });
    const atmosphere = new THREE.Mesh(atmosphereGeo, atmosphereMat);
    earthGroup.add(atmosphere);


    // -- C. 宇宙の星空背景（Starfield） --
    const starCount = 1200;
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      const radius = 25 + Math.random() * 30;
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      starPositions[i] = radius * Math.sin(phi) * Math.cos(theta);
      starPositions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
      starPositions[i + 2] = radius * Math.cos(phi);
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({
      size: 0.08,
      color: 0xffffff,
      transparent: true,
      opacity: 0.45,
      depthWrite: false
    });
    const starField = new THREE.Points(starGeometry, starMaterial);
    scene.add(starField);


    // -- D. トランザクション粒子システムの構築 --
    const activeTxParticles = [];

    function createTxParticle(amount) {
      // 宇宙の彼方からランダムな球面上の座標
      const radius = 28;
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const startPos = new THREE.Vector3(
        radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.sin(phi) * Math.sin(theta),
        radius * Math.cos(phi)
      );

      // BTC金額に応じたスケール（小さな金額でも存在感がでるよう対数ベース）
      const size = Math.min(0.5, 0.08 + Math.log10(amount + 1) * 0.18);
      
      // 金額に応じた色（通常はシアン、大口はエメラルド、超大口はゴールド）
      let color = 0x00d2ff;
      if (amount > 1.0) {
        color = 0xffaa00; // Gold
      } else if (amount > 0.1) {
        color = 0x00ffaa; // Emerald Cloud
      }

      const txGeo = new THREE.SphereGeometry(size, 8, 8);
      const txMat = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });
      const mesh = new THREE.Mesh(txGeo, txMat);
      mesh.position.copy(startPos);
      scene.add(mesh);

      // 中心へ螺旋（らせん）を描いて吸い込まれていくための情報
      activeTxParticles.push({
        mesh: mesh,
        startPos: startPos.clone(),
        progress: 0,
        speed: 0.003 + Math.random() * 0.004,
        spiralOffset: Math.random() * Math.PI * 2,
        spiralRadius: 1.5 + Math.random() * 3.5
      });
    }


    // -- E. 新規ブロック生成時の衝撃波エフェクト --
    let blockWave = null;
    let cameraShake = 0;

    function triggerBlockWave() {
      if (blockWave) {
        scene.remove(blockWave.mesh);
        blockWave.mesh.geometry.dispose();
        blockWave.mesh.material.dispose();
      }

      const waveGeo = new THREE.SphereGeometry(0.4, 24, 24);
      const waveMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        wireframe: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
      });
      const mesh = new THREE.Mesh(waveGeo, waveMat);
      scene.add(mesh);

      blockWave = {
        mesh: mesh,
        scale: 1,
        opacity: 0.85
      };

      cameraShake = 0.8; // 一時的に画面を揺らす
      playBlockSound();
    }


    // --- 3. ANIMATION LOOP ---
    let xw = 0, yw = 0, zw = 0, xy = 0;
    let earthPulseScale = 1.0;

    function animate() {
      requestAnimationFrame(animate);

      // 時間経過による4次元角度の緩やかな変化
      xw += 0.004;
      yw += 0.006;
      zw += 0.002;
      xy += 0.003;

      // 4D頂点の回転＆3D投影
      const projected = vertices4D.map(v => {
        const rotated = rotate4D(v, xw, yw, zw, xy);
        return project4D(rotated);
      });

      // エッジラインの更新
      let posIndex = 0;
      const linePosAttr = tesseractLines.geometry.attributes.position;
      edges.forEach(edge => {
        const v1 = projected[edge[0]];
        const v2 = projected[edge[1]];
        linePosAttr.setXYZ(posIndex++, v1.x, v1.y, v1.z);
        linePosAttr.setXYZ(posIndex++, v2.x, v2.y, v2.z);
      });
      linePosAttr.needsUpdate = true;

      // 頂点ポイントの更新
      const pointPosAttr = tesseractPoints.geometry.attributes.position;
      projected.forEach((v, i) => {
        pointPosAttr.setXYZ(i, v.x, v.y, v.z);
      });
      pointPosAttr.needsUpdate = true;

      // 「地球」の自転と軌道パルス
      ocean.rotation.y += 0.004;
      atmosphere.rotation.y -= 0.0035;
      atmosphere.rotation.x += 0.002;

      // 吸入時のパルス処理
      earthPulseScale += (1.0 - earthPulseScale) * 0.08;
      ocean.scale.set(earthPulseScale, earthPulseScale, earthPulseScale);
      atmosphere.scale.set(earthPulseScale, earthPulseScale, earthPulseScale);

      // 背景星空の極めてゆったりとした公転
      starField.rotation.y += 0.0003;

      // トランザクション粒子の更新
      for (let i = activeTxParticles.length - 1; i >= 0; i--) {
        const p = activeTxParticles[i];
        p.progress += p.speed;

        if (p.progress >= 1.0) {
          // 中心（地球）へ吸い込まれた瞬間
          scene.remove(p.mesh);
          p.mesh.geometry.dispose();
          p.mesh.material.dispose();
          activeTxParticles.splice(i, 1);
          
          earthPulseScale = 1.15; // 地球を脈動させる
        } else {
          // 螺旋吸入移動の数学的な軌道計算
          const currentR = 28 * (1 - p.progress);
          const angle = p.progress * 12.0 + p.spiralOffset;
          const spiralX = Math.cos(angle) * p.spiralRadius * (1 - p.progress);
          const spiralY = Math.sin(angle) * p.spiralRadius * (1 - p.progress);

          const basePos = new THREE.Vector3().lerpVectors(p.startPos, new THREE.Vector3(0,0,0), p.progress);
          const tangent = new THREE.Vector3(-p.startPos.y, p.startPos.x, 0).normalize();
          const bitangent = new THREE.Vector3().crossVectors(p.startPos, tangent).normalize();

          basePos.addScaledVector(tangent, spiralX);
          basePos.addScaledVector(bitangent, spiralY);

          p.mesh.position.copy(basePos);
        }
      }

      // 新ブロック衝撃波の伝播アニメーション
      if (blockWave) {
        blockWave.scale += 0.42;
        blockWave.opacity -= 0.009;
        blockWave.mesh.scale.set(blockWave.scale, blockWave.scale, blockWave.scale);
        blockWave.mesh.material.opacity = blockWave.opacity;

        if (blockWave.opacity <= 0) {
          scene.remove(blockWave.mesh);
          blockWave.mesh.geometry.dispose();
          blockWave.mesh.material.dispose();
          blockWave = null;
        }
      }

      // カメラ揺らし（衝撃波時の微細な揺れ）
      if (cameraShake > 0.01) {
        camera.position.x += (Math.random() - 0.5) * cameraShake * 0.15;
        camera.position.y += (Math.random() - 0.5) * cameraShake * 0.15;
        cameraShake *= 0.92;
      }

      controls.update();
      renderer.render(scene, camera);
    }


    // --- 4. REAL-TIME DATA (MEMPOOL WEBSOCKET) ---
    let ws;
    let txCount = 0;
    let totalBtc = 0;

    // 初期ブロック高の取得
    function fetchInitialBlockHeight() {
      fetch('https://mempool.space/api/blocks/tip/height')
        .then(res => res.json())
        .then(height => {
          document.getElementById('block-height').innerText = height;
        })
        .catch(err => {
          console.warn("Could not load current block height via Mempool API, waiting for WS.", err);
        });
    }

    // Blockchain.com の WebSocket API を用いたリアルタイムな取引取得
    function connectWS() {
      ws = new WebSocket('wss://ws.blockchain.info/inv');

      ws.onopen = () => {
        document.getElementById('status').innerText = 'Synced';
        document.getElementById('status').style.color = '#00ffaa';
        // 未確認トランザクションと新規ブロックの購読
        ws.send(JSON.stringify({ "op": "unconfirmed_sub" }));
        ws.send(JSON.stringify({ "op": "blocks_sub" }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        // トランザクション検知
        if (data.op === 'utx') {
          let satoshis = 0;
          if (data.x && data.x.out) {
            for (let output of data.x.out) {
              satoshis += output.value || 0;
            }
          }
          const btc = satoshis / 100000000;
          
          txCount++;
          totalBtc += btc;

          document.getElementById('tx-count').innerText = txCount;
          document.getElementById('total-btc').innerText = totalBtc.toFixed(4);

          // ビジュアル効果の生成
          createTxParticle(btc);
          // ヒーリング音の出力
          playTxSound(btc);
        }

        // 新規ブロック生成検知
        if (data.op === 'block') {
          if (data.x && data.x.height) {
            document.getElementById('block-height').innerText = data.x.height;
          }
          triggerBlockWave();
        }
      };

      ws.onclose = () => {
        document.getElementById('status').innerText = 'Reconnecting...';
        document.getElementById('status').style.color = '#ffaa00';
        setTimeout(connectWS, 5000); // 5秒後に自動再接続
      };
    }

    // 初始化
    fetchInitialBlockHeight();
    connectWS();
    animate();

    // 画面リサイズ対応
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
